<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <rect width="1200" height="300" fill="#0A0E1A"/>
  <g>
    <circle cx="600" cy="150" r="20" fill="#FFFFFF">
      <animate attributeName="r" values="20;110;20" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="150" r="40" fill="none" stroke="#F59E0B" stroke-width="6">
      <animate attributeName="r" values="40;140;40" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="150" r="60" fill="none" stroke="#C1272D" stroke-width="4">
      <animate attributeName="r" values="60;180;60" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <polygon points="600,70 625,130 690,130 640,170 660,230 600,195 540,230 560,170 510,130 575,130" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 600 150" to="360 600 150" dur="6s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <g fill="#00E5FF">
    <circle cx="600" cy="150" r="6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 600 150 L 480 60 L 480 60"/></circle>
    <circle cx="600" cy="150" r="6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 600 150 L 720 60 L 720 60"/></circle>
    <circle cx="600" cy="150" r="6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 600 150 L 480 240 L 480 240"/></circle>
    <circle cx="600" cy="150" r="6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 600 150 L 720 240 L 720 240"/></circle>
    <circle cx="600" cy="150" r="6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 600 150 L 600 40 L 600 40"/></circle>
    <circle cx="600" cy="150" r="6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 600 150 L 600 260 L 600 260"/></circle>
  </g>
  <text x="600" y="285" font-family="monospace" font-size="22" letter-spacing="4" text-anchor="middle" fill="#E5E7EB">💥 BOOM — DETONATION SEQUENCE 💥</text>
</svg>
