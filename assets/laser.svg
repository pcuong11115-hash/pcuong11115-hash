  </rect>
  <g>
    <rect x="950" y="60" width="120" height="80" rx="14" fill="#C1272D" stroke="#9CA3AF" stroke-width="3"/>
    <circle cx="1010" cy="100" r="18" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="100" r="30" fill="none" stroke="#F59E0B" stroke-width="3">
