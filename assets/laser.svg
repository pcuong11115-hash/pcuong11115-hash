<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <rect width="1200" height="200" fill="#0A0E1A"/>
  <g>
    <rect x="60" y="80" width="180" height="40" rx="10" fill="#374151" stroke="#9CA3AF" stroke-width="3"/>
    <rect x="230" y="92" width="60" height="16" fill="#1E3A8A"/>
    <polygon points="290,85 330,100 290,115" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <rect x="330" y="96" width="0" height="8" fill="#00E5FF">
