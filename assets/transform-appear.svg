      <polygon points="540,40 660,40 640,90 560,90" fill="#C1272D"/>
      <polygon points="560,90 640,90 630,130 570,130" fill="#9CA3AF"/>
      <rect x="585" y="100" width="30" height="14" fill="#00E5FF"/>
