    <polygon points="560,210 640,210 630,280 570,280" fill="#C1272D"/>
  </g>
  <text x="600" y="305" font-family="monospace" font-size="20" letter-spacing="3" text-anchor="middle" fill="#E5E7EB">🤖 TRANSFORMER ASSEMBLING… 🤖</text>
