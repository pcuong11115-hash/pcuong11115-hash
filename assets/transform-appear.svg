      <rect x="460" y="140" width="50" height="110" fill="#374151" stroke="#9CA3AF" stroke-width="2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="120 0;0 0;0 0;120 0" dur="5s" repeatCount="indefinite"/>
      <rect x="690" y="140" width="50" height="110" fill="#374151" stroke="#9CA3AF" stroke-width="2"/>
