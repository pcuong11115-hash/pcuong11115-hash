<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E1A">
        <animate attributeName="stop-color" values="#0A0E1A;#141C2E;#0A0E1A" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#141C2E">
        <animate attributeName="stop-color" values="#141C2E;#1A0F14;#141C2E" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1A0F14"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <g stroke="#22314A" stroke-width="1" opacity="0.6">
    <path d="M 0 320 L 1200 260"/>
    <path d="M 0 200 L 1200 140"/>
    <path d="M 100 380 L 300 0"/>
    <path d="M 500 380 L 700 0"/>
    <path d="M 900 380 L 1100 0"/>
  </g>
  <g fill="#F59E0B">
    <circle cx="120" cy="70" r="4"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="50" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="60" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="40" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="0" y="0" width="1200" height="4" fill="#00E5FF" opacity="0.7">
    <animate attributeName="y" values="0;376;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>
  <g>
    <polygon points="880,60 1060,60 1030,110 910,110" fill="#C1272D"/>
    <polygon points="900,110 1040,110 1020,170 920,170" fill="url(#steel)"/>
    <rect x="940" y="125" width="60" height="18" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <polygon points="930,170 1010,170 1035,230 905,230" fill="#1E3A8A"/>
    <polygon points="910,230 1030,230 1010,285 930,285" fill="#C1272D"/>
    <rect x="860" y="150" width="40" height="90" fill="#374151" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="1040" y="150" width="40" height="90" fill="#374151" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="970" cy="200" r="14" fill="#F59E0B">
      <animate attributeName="r" values="14;19;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform-origin="90 310">
    <circle cx="90" cy="310" r="28" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="12 8"/>
    <animateTransform attributeName="transform" type="rotate" from="0 90 310" to="360 90 310" dur="7s" repeatCount="indefinite"/>
  </g>
  <g transform-origin="180 310">
    <circle cx="180" cy="310" r="18" fill="none" stroke="#00E5FF" stroke-width="5" stroke-dasharray="8 6"/>
    <animateTransform attributeName="transform" type="rotate" from="360 180 310" to="0 180 310" dur="5s" repeatCount="indefinite"/>
  </g>
  <text x="60" y="90" font-family="monospace" font-size="22" letter-spacing="5" fill="#F59E0B">⚙ TRANSFORMERS MODE // ENGAGED</text>
  <text x="58" y="175" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#FFFFFF">Dương Phú Cường</text>
  <text x="60" y="225" font-family="monospace" font-size="24" fill="#E5E7EB">ANDROID DEVELOPER — BUILT TO TRANSFORM</text>
  <text x="60" y="265" font-family="sans-serif" font-size="20" fill="#9CA3AF">Idea → Code → App. Every build, a new form.</text>
  <rect x="60" y="292" width="240" height="6" rx="3" fill="#C1272D"/>
  <rect x="312" y="292" width="120" height="6" rx="3" fill="#1E3A8A"/>
  <rect x="444" y="292" width="48" height="6" rx="3" fill="#F59E0B"/>
</svg>
